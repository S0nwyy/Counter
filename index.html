<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smooth UI with Advanced Color Picker</title>
<style>
body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle at top,#2a2a2a,#111);color:white;font-family:Arial,sans-serif}
#watermark{position:fixed;top:10px;left:10px;font-size:14px;opacity:.8}
#versionPopup{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px) scale(.92);padding:10px 16px;border-radius:14px;background:rgba(0,0,0,.35);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);font-size:16px;font-weight:bold;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;z-index:9999}
#versionPopup.show{opacity:.5;transform:translateX(-50%) translateY(0) scale(1)}
#counter{position:fixed;top:50%;left:50%;font-size:5em;transform:translate(-50%,-50%);user-select:none;will-change:transform}
#timer{position:fixed;top:10px;right:20px;font-size:1.5em;user-select:none;will-change:transform}
.selected{outline:2px solid #ffe066;border-radius:10px;animation:selectedFade 1.6s ease-in-out infinite}
@keyframes selectedFade{0%{box-shadow:0 0 6px rgba(255,224,102,.3),0 0 14px rgba(255,224,102,.15)}50%{box-shadow:0 0 20px rgba(255,224,102,1),0 0 45px rgba(255,224,102,.6)}100%{box-shadow:0 0 6px rgba(255,224,102,.3),0 0 14px rgba(255,224,102,.15)}}
.panel{position:fixed;top:50px;width:260px;padding:14px;border-radius:18px;backdrop-filter:blur(25px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.6);opacity:0;transform:translateY(10px) scale(.95);pointer-events:none;transition:.3s ease;z-index:10}
.panel.active{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
#panel{right:20px}
#advancedPanel{left:20px;top:50px;width:300px;height:300px;padding:10px;border-radius:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.18);opacity:0;pointer-events:none;transition:.3s ease;position:fixed;z-index:11}
#advancedPanel.active{opacity:1;pointer-events:all}
canvas#colorWheel{width:100%;height:100%;display:block;border-radius:50%;cursor:pointer}
h3{margin:6px 0;font-size:.9em;color:#ddd}
.font-option{padding:6px;margin:3px 0;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.05);transition:background .2s ease,transform .2s ease}
.font-option:hover{background:rgba(255,255,255,.12);transform:translateX(3px)}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.color{height:26px;border-radius:6px;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.color:hover{transform:scale(1.08);box-shadow:0 0 12px rgba(255,255,255,.35)}
button{margin-top:10px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.12);color:white;border:none;cursor:pointer;transition:.2s}
button:hover{background:rgba(255,255,255,.25)}

/* Auth */
#authOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:10000;opacity:0;pointer-events:none;transition:opacity .35s ease}
#authOverlay.active{opacity:1;pointer-events:all}
#authBox{width:320px;padding:24px;border-radius:18px;background:rgba(28,28,28,.96);border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 60px rgba(0,0,0,.7);transform:scale(.9) translateY(20px);opacity:0;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .35s ease}
#authOverlay.active #authBox{transform:scale(1) translateY(0);opacity:1}
#authBox h2{margin:0 0 16px;text-align:center;font-size:1.3em;font-weight:600}
.auth-tabs{display:flex;gap:6px;margin-bottom:16px;background:rgba(255,255,255,.04);padding:3px;border-radius:10px}
.auth-tab{flex:1;padding:7px;border-radius:8px;color:#888;cursor:pointer;text-align:center;font-size:.82em;font-weight:500;transition:.2s}
.auth-tab.active{background:rgba(255,255,255,.1);color:#fff}
.auth-field{margin-bottom:10px}
.auth-field label{display:block;font-size:.72em;color:#888;margin-bottom:3px;font-weight:500}
.auth-field input{width:100%;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:.88em;outline:none;box-sizing:border-box;transition:border-color .2s}
.auth-field input:focus{border-color:rgba(255,255,255,.3)}
.auth-btn{width:100%;padding:10px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;border:none;cursor:pointer;font-size:.9em;font-weight:600;transition:.2s;margin-top:4px}
.auth-btn:hover{background:rgba(255,255,255,.2)}
.auth-msg{text-align:center;font-size:.78em;margin-top:8px;min-height:16px}
.auth-msg.error{color:#ff6b6b}
.auth-msg.success{color:#6bff8a}
.auth-view{transition:opacity .3s ease,transform .3s ease}
.auth-view.auth-hidden{display:none!important}
.auth-view.slide-out-left{opacity:0;transform:translateX(-30px);position:absolute}
.auth-view.slide-in{animation:slideIn .35s cubic-bezier(.22,1,.36,1) forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(20px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}

/* Signed in */
#signedInView{text-align:center}
.account-email{font-size:.78em;color:#777;margin-bottom:18px}
.account-email span{color:#bbb;font-weight:500}
.account-actions{display:flex;flex-direction:column;gap:6px}
.account-btn{width:100%;padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,.07);cursor:pointer;font-size:.85em;font-weight:500;transition:all .2s ease;background:rgba(255,255,255,.04);color:#bbb}
.account-btn:hover{background:rgba(255,255,255,.09);color:#eee;border-color:rgba(255,255,255,.12)}
.account-btn.signout{background:rgba(255,80,80,.08);color:#ff7070;border-color:rgba(255,80,80,.15);margin-top:2px}
.account-btn.signout:hover{background:rgba(255,80,80,.16);border-color:rgba(255,80,80,.3)}
.account-btn.signout:active{transform:scale(.95)}
.account-btn.signout.signing-out{animation:signoutGo .4s ease forwards;pointer-events:none}
@keyframes signoutGo{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.92) translateY(8px)}}

/* Change password */
.change-pass-wrap{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.22,1,.36,1),opacity .25s ease;opacity:0}
.change-pass-wrap.open{max-height:250px;opacity:1}
.change-pass-form{padding:12px 0 2px}
.change-pass-form .auth-field{margin-bottom:7px}
.change-pass-form .auth-field label{font-size:.68em}
.change-pass-form .auth-field input{padding:7px 10px;font-size:.82em}
.change-pass-form .auth-btn{padding:8px;font-size:.82em;margin-top:4px;background:rgba(100,180,255,.1);color:#7ab8ff;border:1px solid rgba(100,180,255,.18)}
.change-pass-form .auth-btn:hover{background:rgba(100,180,255,.2)}
</style>
</head>
<body>

<div id="watermark">Made by S0nwy</div>
<div id="versionPopup">V1.2.0</div>
<div id="counter">0</div>
<div id="timer">0:00:00</div>

<div id="panel" class="panel">
  <h3>Fonts</h3><div id="fontList"></div>
  <h3>Colors</h3><div class="color-grid" id="colorGrid"></div>
  <button id="advancedBtn">Advanced Settings</button>
</div>

<div id="advancedPanel" class="panel">
  <canvas id="colorWheel"></canvas>
</div>

<div id="authOverlay">
  <div id="authBox">
    <h2 id="authTitle">Sign In</h2>
    <div class="auth-tabs" id="authTabs">
      <div class="auth-tab active" data-tab="signin" id="tabSignin">Sign In</div>
      <div class="auth-tab" data-tab="signup" id="tabSignup">Sign Up</div>
    </div>

    <div id="signinForm" class="auth-view">
      <form id="signinFormEl">
        <div class="auth-field"><label>Username</label><input type="text" id="signinUsername" required placeholder="Enter username"></div>
        <div class="auth-field"><label>Password</label><input type="password" id="signinPassword" required placeholder="Password"></div>
        <button type="submit" class="auth-btn">Sign In</button>
      </form>
    </div>

    <div id="signupForm" class="auth-view auth-hidden">
      <form id="signupFormEl">
        <div class="auth-field"><label>Username</label><input type="text" id="signupUsername" required placeholder="Choose a username"></div>
        <div class="auth-field"><label>Password</label><input type="password" id="signupPassword" required placeholder="Create a password" minlength="6"></div>
        <div class="auth-field"><label>Confirm Password</label><input type="password" id="signupConfirm" required placeholder="Confirm password"></div>
        <button type="submit" class="auth-btn">Sign Up</button>
      </form>
    </div>

    <div id="signedInView" class="auth-view auth-hidden">
      <div class="account-email">Playing as <span id="signedInUser"></span></div>
      <div class="account-actions">
        <button class="account-btn" id="changePassToggle">Change Password</button>
        <div class="change-pass-wrap" id="changePassWrap">
          <form class="change-pass-form" id="changePassForm">
            <div class="auth-field"><label>Current Password</label><input type="password" id="currPassword" required placeholder="Current password"></div>
            <div class="auth-field"><label>New Password</label><input type="password" id="newPassword" required placeholder="New password" minlength="6"></div>
            <div class="auth-field"><label>Confirm New Password</label><input type="password" id="confirmNewPassword" required placeholder="Confirm new password"></div>
            <button type="submit" class="auth-btn">Update Password</button>
          </form>
        </div>
        <button class="account-btn signout" id="signoutBtn">Sign Out</button>
      </div>
    </div>

    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,EmailAuthProvider,reauthenticateWithCredential,updatePassword,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBesgnQfvIrgj2Ewn4X0A0qvFnmaZbQ3Lc",authDomain:"counter-2ca08.firebaseapp.com",projectId:"counter-2ca08",storageBucket:"counter-2ca08.firebasestorage.app",messagingSenderId:"513934053456",appId:"1:513934053456:web:75b9cb3142050d88690155",measurementId:"G-BEQJ0TWES5"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
await setPersistence(auth,browserLocalPersistence);

// ═══════════════════════════════════════
// PREFS SYSTEM
// ═══════════════════════════════════════
const DEFAULT_PREFS={font:"Arial",color:"#ffffff"};
let prefs=JSON.parse(localStorage.getItem("counterPrefs")||"{}");
prefs={...DEFAULT_PREFS,...prefs};

const FONTS=["Arial","Verdana","Tahoma","Georgia","Courier New","Times New Roman","Impact","Comic Sans MS"];
const COLORS=["#ffffff","#4da6ff","#ff9966","#ffd24d","#ff4d6d","#66ff99","#b366ff","#00e5ff"];

FONTS.forEach(f=>{
  const d=document.createElement("div");
  d.className="font-option";d.textContent=f;d.style.fontFamily=f;d.dataset.font=f;
  d.onclick=()=>changePref("font",f);
  document.getElementById("fontList").appendChild(d);
});
COLORS.forEach(c=>{
  const d=document.createElement("div");
  d.className="color";d.style.background=c;d.dataset.color=c;
  d.onclick=()=>changePref("color",c);
  document.getElementById("colorGrid").appendChild(d);
});

function changePref(key,val){
  if(prefs[key]===val)return;
  prefs[key]=val;
  applyPrefs();
  if(auth.currentUser){
    setDoc(doc(db,"users",auth.currentUser.uid),{prefs:{[key]:val}},{merge:true}).catch(()=>{});
  }
}

function applyPrefs(){
  document.body.style.fontFamily=prefs.font;
  document.body.style.color=prefs.color;
  localStorage.setItem("counterPrefs",JSON.stringify(prefs));
  document.querySelectorAll(".font-option").forEach(el=>{
    const on=el.dataset.font===prefs.font;
    el.style.outline=on?"2px solid #ffe066":"none";
    el.style.background=on?"rgba(255,224,102,.15)":"rgba(255,255,255,.05)";
  });
  document.querySelectorAll(".color").forEach(el=>{
    const on=el.dataset.color&&el.dataset.color.toLowerCase()===prefs.color.toLowerCase();
    el.style.outline=on?"2px solid #ffe066":"none";
    el.style.boxShadow=on?"0 0 12px rgba(255,224,102,.6)":"none";
  });
}
applyPrefs();

// ═══════════════════════════════════════
// AUTH SYSTEM
// ═══════════════════════════════════════
let lastKnownUsername="";
let prefsUnsub=null;

function showMsg(text,type){
  const el=document.getElementById("authMsg");
  el.textContent=text;
  el.className="auth-msg"+(type?" "+type:"");
}

function switchTab(tab){
  const cur=window._curTab||"signin";
  if(cur===tab)return;
  const from=document.getElementById(cur==="signin"?"signinForm":"signupForm");
  if(from){from.classList.remove("slide-in");from.classList.add("slide-out-left");setTimeout(()=>{from.classList.add("auth-hidden");from.classList.remove("slide-out-left")},280)}
  document.getElementById("tabSignin").classList.toggle("active",tab==="signin");
  document.getElementById("tabSignup").classList.toggle("active",tab==="signup");
  document.getElementById("authTitle").textContent=tab==="signin"?"Sign In":"Sign Up";
  const to=document.getElementById(tab==="signin"?"signinForm":"signupForm");
  if(to){to.classList.remove("auth-hidden");to.classList.add("slide-in")}
  window._curTab=tab;showMsg("");
}

function showAccount(name){
  lastKnownUsername=name;
  document.getElementById("signinForm").classList.add("auth-hidden");
  document.getElementById("signupForm").classList.add("auth-hidden");
  document.getElementById("authTabs").style.display="none";
  document.getElementById("authTitle").textContent="Account";
  document.getElementById("signedInUser").textContent=name;
  const sv=document.getElementById("signedInView");
  sv.classList.remove("auth-hidden");sv.classList.add("slide-in");
  showMsg("");
}

function showLoginForms(){
  document.getElementById("signedInView").classList.add("auth-hidden");
  document.getElementById("authTabs").style.display="";
  switchTab("signin");
}

function toEmail(u){return u.replace(/[^a-zA-Z0-9]/g,"_")+"@counter.app"}

// Auth state
onAuthStateChanged(auth,async user=>{
  if(prefsUnsub){prefsUnsub();prefsUnsub=null;}
  if(!user)return;
  const ref=doc(db,"users",user.uid);
  try{
    const snap=await getDoc(ref);
    if(snap.exists()){
      const d=snap.data();
      showAccount(d.username||user.email);
      document.getElementById("authOverlay").classList.remove("active");
      if(d.prefs){
        if(d.prefs.font&&d.prefs.font!==prefs.font){prefs.font=d.prefs.font;applyPrefs()}
        if(d.prefs.color&&d.prefs.color!==prefs.color){prefs.color=d.prefs.color;applyPrefs()}
      }
    }else{
      showAccount(user.email);
      document.getElementById("authOverlay").classList.remove("active");
    }
  }catch(e){
    showAccount(user.email);
    document.getElementById("authOverlay").classList.remove("active");
  }
  // Real-time sync
  prefsUnsub=onSnapshot(ref,snap=>{
    if(!snap.exists())return;
    const d=snap.data();
    if(!d.prefs)return;
    if(d.prefs.font&&d.prefs.font!==prefs.font){prefs.font=d.prefs.font;applyPrefs()}
    if(d.prefs.color&&d.prefs.color!==prefs.color){prefs.color=d.prefs.color;applyPrefs()}
  },()=>{});
});

// ═══════════════════════════════════════
// EVENT HANDLERS (no inline onclick)
// ═══════════════════════════════════════
document.getElementById("tabSignin").onclick=()=>switchTab("signin");
document.getElementById("tabSignup").onclick=()=>switchTab("signup");

document.getElementById("signinFormEl").onsubmit=async function(e){
  e.preventDefault();
  const u=document.getElementById("signinUsername").value.trim();
  const p=document.getElementById("signinPassword").value;
  if(!u||!p)return showMsg("Fill all fields","error");
  try{
    await signInWithEmailAndPassword(auth,toEmail(u),p);
    showMsg("Signed in!","success");
  }catch(err){
    const m=err.code;
    if(m==="auth/user-not-found")showMsg("No account with that username","error");
    else if(m==="auth/wrong-password"||m==="auth/invalid-credential")showMsg("Wrong password","error");
    else if(m==="auth/too-many-requests")showMsg("Too many attempts. Try later.","error");
    else showMsg(err.message,"error");
  }
};

document.getElementById("signupFormEl").onsubmit=async function(e){
  e.preventDefault();
  const u=document.getElementById("signupUsername").value.trim();
  const p=document.getElementById("signupPassword").value;
  const c=document.getElementById("signupConfirm").value;
  if(!u)return showMsg("Username required","error");
  if(p!==c)return showMsg("Passwords don't match","error");
  if(p.length<6)return showMsg("Password min 6 chars","error");
  try{
    const cred=await createUserWithEmailAndPassword(auth,toEmail(u),p);
    await setDoc(doc(db,"users",cred.user.uid),{username:u,prefs:{font:prefs.font,color:prefs.color}});
    showMsg("Account created!","success");
    setTimeout(()=>document.getElementById("authOverlay").classList.remove("active"),800);
  }catch(err){
    if(err.code==="auth/email-already-in-use")showMsg("Username already taken","error");
    else if(err.code==="auth/weak-password")showMsg("Password too weak","error");
    else showMsg(err.message,"error");
  }
};

document.getElementById("changePassToggle").onclick=function(){
  const w=document.getElementById("changePassWrap");
  w.classList.toggle("open");
  this.textContent=w.classList.contains("open")?"Cancel":"Change Password";
  if(!w.classList.contains("open")){
    document.getElementById("currPassword").value="";
    document.getElementById("newPassword").value="";
    document.getElementById("confirmNewPassword").value="";
    showMsg("");
  }
};

document.getElementById("changePassForm").onsubmit=async function(e){
  e.preventDefault();
  const cur=document.getElementById("currPassword").value;
  const np=document.getElementById("newPassword").value;
  const cf=document.getElementById("confirmNewPassword").value;
  if(np.length<6)return showMsg("New password min 6 chars","error");
  if(np!==cf)return showMsg("Passwords don't match","error");
  try{
    const u=auth.currentUser;
    await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,cur));
    await updatePassword(u,np);
    document.getElementById("currPassword").value="";
    document.getElementById("newPassword").value="";
    document.getElementById("confirmNewPassword").value="";
    showMsg("Password updated!","success");
  }catch(err){
    if(err.code==="auth/wrong-password"||err.code==="auth/invalid-credential")showMsg("Current password wrong","error");
    else if(err.code==="auth/too-many-requests")showMsg("Too many attempts","error");
    else showMsg(err.message,"error");
  }
};

document.getElementById("signoutBtn").onclick=async function(){
  this.classList.add("signing-out");
  if(auth.currentUser){
    await setDoc(doc(db,"users",auth.currentUser.uid),{prefs:{font:prefs.font,color:prefs.color}},{merge:true}).catch(()=>{});
  }
  if(prefsUnsub){prefsUnsub();prefsUnsub=null;}
  await signOut(auth);
  prefs.font=DEFAULT_PREFS.font;prefs.color=DEFAULT_PREFS.color;
  applyPrefs();
  showLoginForms();
  document.getElementById("authOverlay").classList.add("active");
  this.classList.remove("signing-out");
};

// Account panel button
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="l"){
    e.preventDefault();
    const ov=document.getElementById("authOverlay");
    if(ov.classList.contains("active")){ov.classList.remove("active")}
    else{if(auth.currentUser)showAccount(lastKnownUsername||auth.currentUser.email);else showLoginForms();ov.classList.add("active")}
  }
});

// ═══════════════════════════════════════
// TIMER
// ═══════════════════════════════════════
let start=Date.now();
function updateTimer(){
  const ms=Date.now()-start;
  document.getElementById("counter").textContent=ms.toLocaleString();
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  document.getElementById("timer").textContent=`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  requestAnimationFrame(updateTimer);
}
updateTimer();

// ═══════════════════════════════════════
// DRAGGABLE OBJECTS
// ═══════════════════════════════════════
let selected=null;

function setupObject(el,isCenter,horizontalOnly,noRotation){
  let x=0,y=0,tx=0,ty=0,rot=0,trot=0;
  el._state={get targetRotation(){return trot},set targetRotation(v){trot=v},noRotation};
  el.addEventListener("click",()=>{
    const p=document.getElementById("panel");
    const ap=document.getElementById("advancedPanel");
    if(!p.classList.contains("active")&&!ap.classList.contains("active"))return;
    if(selected===el){el.classList.remove("selected");selected=null;return}
    document.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
    selected=el;el.classList.add("selected");
  });
  function clamp(){
    const r=el.getBoundingClientRect();
    if(horizontalOnly){
      if(r.left<0)tx-=r.left;
      if(r.right>window.innerWidth)tx-=r.right-window.innerWidth;
      ty=0;
    }else{
      if(r.left<0)tx-=r.left;
      if(r.right>window.innerWidth)tx-=r.right-window.innerWidth;
      if(r.top<0)ty-=r.top;
      if(r.bottom>window.innerHeight)ty-=r.bottom-window.innerHeight;
    }
  }
  function animate(){
    clamp();
    x+=(tx-x)*0.10;y+=(ty-y)*0.10;rot+=(trot-rot)*0.10;
    el.style.transform=isCenter?`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${rot}deg)`:`translate(${x}px,${y}px) rotate(${rot}deg)`;
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener("keydown",e=>{
    if(selected!==el)return;
    const p=document.getElementById("panel");
    const ap=document.getElementById("advancedPanel");
    if(!p.classList.contains("active")&&!ap.classList.contains("active"))return;
    const k=e.key.toLowerCase();
    if(k==="w"||k==="arrowup"){if(!horizontalOnly)ty-=40}
    else if(k==="s"||k==="arrowdown"){if(!horizontalOnly)ty+=40}
    else if(k==="a"||k==="arrowleft")tx-=40;
    else if(k==="d"||k==="arrowright")tx+=40;
  });
  window.addEventListener("resize",clamp);
}

setupObject(document.getElementById("counter"),true,false,false);
setupObject(document.getElementById("timer"),false,false,false);
setupObject(document.getElementById("watermark"),false,true,true);

// J/L rotation
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if((k==="j"||k==="l")&&selected&&selected._state&&!selected._state.noRotation){
    selected._state.targetRotation=Math.max(-90,Math.min(90,selected._state.targetRotation+(k==="j"?10:-10)));
  }
});

// Panel toggle
window.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="u"){
    document.getElementById("panel").classList.toggle("active");
    document.getElementById("advancedPanel").classList.remove("active");
    selected=null;document.querySelectorAll(".selected").forEach(el=>el.classList.remove("selected"));
  }
});

// Version popup
window.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="v"){
    const vp=document.getElementById("versionPopup");
    vp.classList.add("show");setTimeout(()=>vp.classList.remove("show"),3000);
  }
});

// Advanced panel
document.getElementById("advancedBtn").onclick=()=>document.getElementById("advancedPanel").classList.toggle("active");

// ═══════════════════════════════════════
// COLOR WHEEL
// ═══════════════════════════════════════
const cw=document.getElementById("colorWheel");
const cctx=cw.getContext("2d");

function drawWheel(){
  const w=cw.width=cw.offsetWidth,h=cw.height=cw.offsetHeight;
  const img=cctx.createImageData(w,h);
  const cx=w/2,cy=h/2,r=Math.min(w,h)/2;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy);
    const i=(y*w+x)*4;
    if(d<=r){
      let a=Math.atan2(dy,dx);if(a<0)a+=Math.PI*2;
      const h=a/(Math.PI*2),s=d/r,v=1;
      let R,G,B,ii=Math.floor(h*6),f=h*6-ii,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
      switch(ii%6){case 0:R=v;G=t;B=p;break;case 1:R=q;G=v;B=p;break;case 2:R=p;G=v;B=t;break;case 3:R=p;G=q;B=v;break;case 4:R=t;G=p;B=v;break;case 5:R=v;G=p;B=q;break}
      img.data[i]=R*255;img.data[i+1]=G*255;img.data[i+2]=B*255;img.data[i+3]=255;
    }else{img.data[i+3]=0}
  }
  cctx.putImageData(img,0,0);
}

function pickColor(e){
  const rect=cw.getBoundingClientRect();
  const x=Math.floor(e.clientX-rect.left),y=Math.floor(e.clientY-rect.top);
  const d=cctx.getImageData(x,y,1,1).data;
  if(d[3]>0)changePref("color",`rgb(${d[0]},${d[1]},${d[2]})`);
}

drawWheel();
let dragging=false;
cw.addEventListener("mousedown",e=>{dragging=true;pickColor(e)});
window.addEventListener("mouseup",()=>dragging=false);
cw.addEventListener("mousemove",e=>{if(dragging)pickColor(e)});
window.addEventListener("resize",drawWheel);
</script>
